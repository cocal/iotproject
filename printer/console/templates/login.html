<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 打印控制台</title><link rel="stylesheet" href="/console/static/style.css"></head>
<body class="login-body"><main class="login-card"><div class="brand">PRINT / CONSOLE</div><h1>打印指令控制台</h1><p class="muted">登录以查看接收记录、单据内容和处理状态。</p>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>账号<input name="username" autocomplete="username" required maxlength="64" autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<button class="primary" type="submit">登录控制台</button></form><a class="doc-link" href="/">查看方案文档 →</a></main></body></html>
