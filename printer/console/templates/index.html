<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>接收记录 · 打印控制台</title><link rel="stylesheet" href="/console/static/style.css"><script src="/console/static/app.js" defer></script></head><body>
<header><div><span class="brand">PRINT / CONSOLE</span><h1>打印指令</h1><p class="muted">查看已接收的单据，追踪来源和处理状态。</p></div><nav><a href="/">方案文档</a><span>{{ username }}</span><form action="/console/logout" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><button>退出登录</button></form></nav></header>
<main><section class="toolbar"><form id="filters"><label class="search">单号或客户<input name="q" placeholder="搜索单号、客户名称" maxlength="128"></label><label>来源 IP<input name="ip" placeholder="全部来源"></label><label>任务状态<select name="status"><option value="">全部状态</option><option value="queued">待投递</option><option value="accepted">已接收</option><option value="printing">打印中</option><option value="succeeded">已完成</option><option value="render_failed">渲染失败</option><option value="failed">失败</option><option value="cancelled">已取消</option></select></label><label>开始日期<input name="from" type="date"></label><label>结束日期<input name="to" type="date"></label><button class="primary">查询</button><button type="reset">重置</button></form></section>
<section class="records"><div class="section-head"><div><h2>接收记录 <span id="total">—</span></h2><p class="muted">时间以北京时间显示；“待投递”表示数据已保存，不代表已打印。</p></div><button id="refresh">刷新</button></div><p id="error" class="error" role="alert" hidden></p><div class="table-scroll"><table><thead><tr><th>接收时间</th><th>单号 / 记录 ID</th><th>客户</th><th>来源 IP</th><th>状态</th><th>产物</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">正在读取…</td></tr></tbody></table></div><footer><span id="page-info"></span><div><button id="previous">上一页</button><button id="next">下一页</button></div></footer></section></main>
<dialog id="detail"><div class="detail-head"><h2>单据详情</h2><button id="close-detail" aria-label="关闭详情">关闭</button></div><p id="detail-message"></p><dl id="metadata"></dl><h3>接收原文</h3><pre id="raw"></pre><h3>解析结果</h3><pre id="parsed"></pre><p id="job-error" class="error"></p></dialog>
</body></html>
