server:
  port: 8080
  shutdown: graceful

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/printer}
    username: ${DATABASE_USERNAME:printer}
    password: ${DATABASE_PASSWORD:printer}
  flyway:
    enabled: true

printer:
  api:
    key: ${PRINT_API_KEY:}
  legacy:
    port: ${LEGACY_TCP_PORT:9100}
  delivery:
    reaper-delay-ms: ${DELIVERY_REAPER_DELAY_MS:30000}
  tunnel:
    enabled: ${TUNNEL_ENABLED:false}
    bind: ${TUNNEL_BIND:0.0.0.0}
    port: ${TUNNEL_PORT:9443}
    max-connections: ${TUNNEL_MAX_CONNECTIONS:64}
    key-store: ${TUNNEL_KEY_STORE:}
    key-store-password: ${TUNNEL_KEY_STORE_PASSWORD:}
    mappings: []
